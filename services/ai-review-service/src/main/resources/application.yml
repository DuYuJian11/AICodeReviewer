server:
  port: 8084

spring:
  application:
    name: ai-review-service

  datasource:
    url: jdbc:mysql://localhost:3306/ai_code_review?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: acore
    password: acore123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.acore.aireview.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# AI API 配置
ai:
  provider: deepseek
  api-key: ${AI_API_KEY:sk-your-api-key-here}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  max-tokens: 4096
  timeout-seconds: 120
  # Mock 模式：本地开发/测试时开启可避免真实 API 调用（生产必须为 false）
  mock-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.acore: DEBUG